# Run this config on pipe, where the existing deploy key is available.
Host obfuscator-de1
    HostName de1.obfuscator.funsociety.dev
    Port 2222
    User deploy
    BatchMode yes
Host az1.obfuscator.funsociety.dev
    HostName 127.0.0.1
    Port 12222
    User deploy
    ProxyJump obfuscator-de1
    HostKeyAlias 192.168.0.194
    BatchMode yes
    StrictHostKeyChecking yes
