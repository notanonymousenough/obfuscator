global
 log /dev/log local0
 user haproxy
 group haproxy
 maxconn 2048
defaults
 log global
 mode tcp
 timeout connect 10s
 timeout client 1h
 timeout server 1h
frontend tls_ingress
 bind 0.0.0.0:443
 tcp-request inspect-delay 5s
 tcp-request content accept if { req.ssl_hello_type 1 }
 use_backend legacy_mtp if { req.ssl_sni -i az1.obfuscator.funsociety.dev }
 use_backend managed_mtp if { req.ssl_sni -i mtp.funsociety.dev }
 default_backend xhttp_az1
backend legacy_mtp
 server mtg 127.0.0.1:8448
backend managed_mtp
 server telemt 127.0.0.1:8446
backend xhttp_az1
 server nginx 127.0.0.1:8444
