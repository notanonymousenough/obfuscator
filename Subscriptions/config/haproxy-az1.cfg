global
 log /dev/log local0
 user haproxy
 group haproxy
 maxconn 2048
defaults
 log global
 mode tcp
 timeout connect 10s
 timeout client 1h
 timeout server 1h
frontend tls_ingress
 bind 0.0.0.0:443
 tcp-request inspect-delay 5s
 # Do not advance past set-var until the complete SNI sample is available.
 tcp-request content set-var(sess.route_sni) req.ssl_sni if { req.ssl_sni -m found }
 tcp-request content accept if { var(sess.route_sni) -m found }
 use_backend managed_mtp if { var(sess.route_sni) -m str -i mtp.funsociety.dev }
 default_backend xhttp_az1
backend managed_mtp
 server telemt 127.0.0.1:8446
backend xhttp_az1
 server nginx 127.0.0.1:8444
