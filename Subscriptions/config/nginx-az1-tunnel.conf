# Cloudflare terminates public TLS. This origin is loopback-only.
server {
 listen 127.0.0.1:18080;
 server_name az1.funsociety.dev;
 access_log off;
 client_max_body_size 0;
 location = /.well-known/obfuscator-node {
  default_type text/plain;
  return 200 'obfuscator-az1\n';
 }
 location ^~ /obfuscator-xhttp-az1 {
  proxy_pass http://127.0.0.1:8445;
  proxy_http_version 1.1;
  proxy_set_header Connection "";
  proxy_set_header Host $host;
  proxy_buffering off;
  proxy_request_buffering off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
 }
 location / { root /var/www/obfuscator; try_files $uri /index.html; }
}
