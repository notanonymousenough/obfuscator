global
 log /dev/log local0
 user haproxy
 group haproxy
 maxconn 4096
 stats socket /run/haproxy/admin.sock mode 660 level admin
defaults
 log global
 mode tcp
 timeout connect 10s
 timeout client 1h
 timeout server 1h
frontend tls_ingress
 bind 0.0.0.0:443
 tcp-request inspect-delay 5s
 tcp-request content accept if { req.ssl_hello_type 1 }
 use_backend mtproto_az1_legacy if { req.ssl_sni -i az1.obfuscator.funsociety.dev }
 use_backend mtproto_pool if { req.ssl_sni -i mtp.funsociety.dev }
 use_backend xhttp_az1 if { req.ssl_sni -i vpn-az1.obfuscator.funsociety.dev }
 default_backend xhttp_de1
backend mtproto_az1_legacy
 server az1 127.0.0.1:9443
backend xhttp_de1
 server nginx 127.0.0.1:8444
backend xhttp_az1
 server az1 127.0.0.1:9444 check inter 5s fall 3 rise 2
backend mtproto_pool
 balance leastconn
 option tcp-check
 default-server inter 5s fall 3 rise 2
 server de1 127.0.0.1:8446 check
 server az1 127.0.0.1:9446 check
