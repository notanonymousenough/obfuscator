server {
 listen 127.0.0.1:8444 ssl http2;
 server_name obfuscator.funsociety.dev mtp.funsociety.dev;
 ssl_certificate /etc/letsencrypt/live/obfuscator-portal/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/obfuscator-portal/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /dev/null crit;
 client_max_body_size 1k;
 location / {
  proxy_pass http://127.0.0.1:9080;
  proxy_set_header Host $host;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
 }
}
