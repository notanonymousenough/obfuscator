server {
 listen 127.0.0.1:8444 ssl http2;
 server_name vpn-az1.obfuscator.funsociety.dev;
 ssl_certificate /etc/letsencrypt/live/obfuscator-az1-vpn/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/obfuscator-az1-vpn/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /dev/null crit;
 client_max_body_size 0;
 location = /.well-known/obfuscator-node { default_type text/plain; return 200 'obfuscator-az1\n'; }
 location ^~ /obfuscator-xhttp-az1 {
  grpc_pass grpc://127.0.0.1:8445;
  grpc_read_timeout 1h;
  grpc_send_timeout 1h;
  grpc_set_header Host $host;
  grpc_set_header X-Real-IP $remote_addr;
 }
 location / { root /var/www/obfuscator; try_files $uri /index.html; }
}
server {
 listen 127.0.0.1:8447 ssl;
 server_name mtp.funsociety.dev;
 ssl_certificate /etc/letsencrypt/live/obfuscator-az1-vpn/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/obfuscator-az1-vpn/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /dev/null crit;
 root /var/www/obfuscator;
 location / {
  proxy_pass https://obfuscator.funsociety.dev;
  proxy_ssl_server_name on;
  proxy_ssl_name obfuscator.funsociety.dev;
  proxy_ssl_verify on;
  proxy_ssl_verify_depth 3;
  proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
  proxy_set_header Host mtp.funsociety.dev;
  proxy_read_timeout 15s;
 }
}
server {
 listen 80;
 server_name vpn-az1.obfuscator.funsociety.dev az1.obfuscator.funsociety.dev;
 access_log off;
 error_log /dev/null crit;
 location / { return 301 https://$host$request_uri; }
}
