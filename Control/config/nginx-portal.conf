server {
 listen 127.0.0.1:8449 ssl http2 proxy_protocol;
 server_name obfuscator.funsociety.dev;
 set_real_ip_from 127.0.0.1;
 real_ip_header proxy_protocol;
 ssl_certificate /etc/letsencrypt/live/obfuscator-portal/fullchain.pem;
 ssl_certificate_key /etc/letsencrypt/live/obfuscator-portal/privkey.pem;
 ssl_protocols TLSv1.2 TLSv1.3;
 access_log off;
 error_log /dev/null crit;
 client_max_body_size 1k;
 location ^~ /control/ {
  include /etc/nginx/snippets/obfuscator-control-allow.conf;
  client_max_body_size 16m;
  proxy_pass http://127.0.0.1:1337;
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $remote_addr;
  proxy_set_header X-Forwarded-Proto https;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $obf_connection_upgrade;
  proxy_cookie_flags ~ secure httponly samesite=lax;
  proxy_buffering off;
  proxy_read_timeout 1h;
 }
 location / {
  proxy_pass http://127.0.0.1:9080;
  proxy_set_header Host $host;
  proxy_connect_timeout 3s;
  proxy_read_timeout 15s;
 }
}
